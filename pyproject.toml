[project]
name = "yz-satellite-common"
version = "0.0.3"
description = "Shared code for yz-* satellites and core: event broadcaster + /events WS router, persistent-settings engine, YZ_PORT-standard server entry, and the sheet record (fact merge math)."
readme = "README.md"
requires-python = ">=3.10"
# Deliberately dependency-free: fastapi/uvicorn are imported lazily inside
# the helpers that need them, and every satellite that uses those helpers
# already depends on both. Keeps the wheel installable everywhere (CLI
# paths, test rigs) without dragging a server stack along.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yz_satellite_common"]
